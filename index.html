<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c1420">
<title>Beat Parry</title>
<style>
@font-face{font-family:Galmuri11;src:url(fonts/Galmuri11.woff2) format('woff2');font-display:swap}
:root{--ink:#0c1420;--slate:#1b2a38;--bone:#d8d0b8;--signal:#ff5a6e;--amber:#ffc857}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--bone);font:13px Galmuri11,monospace;overflow:hidden}
button,input{font:inherit}
canvas{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(100vw,200vh);height:auto}
#menu{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));z-index:10;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#menu button{background:var(--slate);color:var(--bone);border:2px solid var(--bone);border-radius:0;padding:6px 10px;cursor:pointer;box-shadow:3px 3px 0 #000a;transition:transform .06s,box-shadow .06s}
#bar{display:flex;gap:8px}
#ver{position:fixed;left:max(8px,env(safe-area-inset-left));bottom:max(6px,env(safe-area-inset-bottom));z-index:5;color:var(--bone);opacity:.5;font-size:11px;pointer-events:none}
#menu button.ic{width:40px;height:40px;padding:0;display:grid;place-items:center}
#menu button:hover{background:#26394b}
#menu button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000a}
#menu button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#list{display:none;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px;background:var(--ink);border:2px solid var(--bone);box-shadow:3px 3px 0 #000a;max-height:70vh;overflow:auto;}
#list.open{display:grid}
#list .boss{grid-column:span 2;border-color:var(--signal)}
</style></head><body>
<div id="menu"><div id="bar"><button id="mbtn" class="ic" type="button" title="스테이지 선택" aria-label="스테이지 선택"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></button></div><div id="list"></div></div>
<div id="ver"></div>
<canvas id="c" width="720" height="360"></canvas>
<div hidden><input id="bpm" value="120"><input id="off" value="0"><input id="win" value="120"><input id="voff" value="0"></div>
<script src="version.js"></script>
<script>document.getElementById("ver").textContent=VERSION</script>
<script src="stages.js"></script>
<script src="main.js"></script>
<script src="mobile.js"></script>
<script src="settings.js"></script>
<script>
{ const list=document.getElementById('list'), add=(label,n,mode,cls)=>{ const b=document.createElement('button'); b.type='button'; b.textContent=label; if(cls) b.className=cls;
    b.onclick=()=>{ goStage(n,b,mode); list.classList.remove('open') }; list.appendChild(b) };
  for(let n=1;n<=24;n++) add('ST'+n,n);
  for(let b=1;b<=3;b++) for(const m of ['normal','hard']) add('BOSS'+b+' '+(m==='hard'?'HARD':'NORMAL'),24+b,m,'boss');
  document.getElementById('mbtn').onclick=()=>list.classList.toggle('open') }
</script>
</body></html>
